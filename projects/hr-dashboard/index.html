<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Dashboard</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font:16px Arial;background:#f4f7fb;color:#14243b;margin:0}header{background:#102b50;color:white;padding:28px 6%}main{max-width:1100px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px}input,select{padding:10px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:9px;border-bottom:1px solid #e4eaf1;text-align:left}</style></head><body><header><h1>HR Analytics Dashboard</h1><p>Upload an HR Excel workbook to explore workforce KPIs privately in your browser</p></header><main><section class="card"><input type="file" id="file" accept=".xlsx,.xls,.csv"><p id="status">Choose an Excel or CSV file. Your workbook is processed in this browser and is not uploaded to a server.</p></section><div class="grid"><div class="card">Rows<h2 id="rows">0</h2></div><div class="card">Columns<h2 id="cols">0</h2></div><div class="card">Numeric fields<h2 id="nums">0</h2></div></div><section class="card"><label>Worksheet <select id="sheet"></select></label><div id="table"></div></section></main><script>let wb;file.onchange=async()=>{let f=file.files[0];if(!f)return;let data=await f.arrayBuffer();wb=XLSX.read(data);sheet.innerHTML=wb.SheetNames.map(n=>'<option>'+n+'</option>').join('');sheet.onchange=show;show()};function show(){let rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet.value],{defval:''});let cols=rows.length?Object.keys(rows[0]):[];rows.textContent='';document.getElementById('rows').textContent=rows.length;document.getElementById('cols').textContent=cols.length;document.getElementById('nums').textContent=cols.filter(c=>rows.some(r=>typeof r[c]==='number')).length;status.textContent='Loaded '+sheet.value+' locally.';table.innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>'<td>'+String(r[c]).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}</script></body></html>
