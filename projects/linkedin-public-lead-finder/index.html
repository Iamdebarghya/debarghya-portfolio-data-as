<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Lead Finder</title><style>body{font:16px Arial;background:#f4f7fb;color:#14243b;margin:0}header{background:#102b50;color:white;padding:28px 6%}main{max-width:850px;margin:30px auto;padding:0 18px}.card{background:white;padding:22px;border-radius:12px}input,button{padding:12px;margin:6px;border:1px solid #ccd5e1;border-radius:7px}button{background:#12345b;color:white;cursor:pointer}</style></head><body><header><h1>Public Lead Finder</h1><p>Build targeted public-profile search queries without scraping private data</p></header><main><div class="card"><label>Job title / role <input id="role" value="Data Analyst"></label><label>Location <input id="loc" value="India"></label><label>Industry <input id="industry" placeholder="e.g. SaaS, retail"></label><button onclick="go()">Generate Google search</button><button onclick="csv()">Export search brief CSV</button><p id="query"></p><p><a id="link" target="_blank" rel="noopener"></a></p><small>Searches publicly indexed pages only. No LinkedIn login, private data collection, or automated scraping.</small></div></main><script>let q='';function go(){q='site:linkedin.com/in/ "'+role.value+'" "'+loc.value+'" '+industry.value;query.textContent=q;link.href='https://www.google.com/search?q='+encodeURIComponent(q);link.textContent='Open public search results'}function csv(){let s='Role,Location,Industry,Search query\n"'+role.value+'","'+loc.value+'","'+industry.value+'","'+q.replaceAll('"','""')+'"';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='lead-search-brief.csv';a.click()}</script></body></html>
