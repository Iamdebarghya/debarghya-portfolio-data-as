ly="Arial" font-size="20">Operational priority</text><text x="930" y="540" fill="#D6AE52" font-family="Arial" font-size="23" font-weight="bold">1. Delivery mode</text><text x="930" y="585" fill="#B6AA91" font-family="Arial" font-size="16">Investigate Express SLA reliability.</text><text x="930" y="630" fill="#D6AE52" font-family="Arial" font-size="23" font-weight="bold">2. Operational factors</text><text x="930" y="675" fill="#B6AA91" font-family="Arial" font-size="16">Distance, weight and vehicle mix.</text><text x="90" y="700" fill="#D6AE52" font-family="Arial" font-size="14">Source-reported approximate rates; validate with the raw public CSV before presenting as reproduced results.</text></svg>