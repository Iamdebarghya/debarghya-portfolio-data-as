name: Olist project tests

on:
  push:
    branches: [main]
    paths:
      - "projects/olist-ecommerce-analytics/**"
      - ".github/workflows/olist-tests.yml"
  pull_request:
    paths:
      - "projects/olist-ecommerce-analytics/**"
      - ".github/workflows/olist-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/olist-ecommerce-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pandas>=2.2,<3"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
